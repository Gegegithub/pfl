<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 627px;
    overflow: hidden;
    background-color: #0E0E0E;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 48px 48px;
    font-family: 'Geist', sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 96px;
    position: relative;
  }

  /* faint "GB" monogram in the background right side */
  body::after {
    content: 'GB';
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Geist', sans-serif;
    font-weight: 700;
    font-size: 420px;
    letter-spacing: -0.06em;
    color: rgba(255,255,255,0.025);
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }

  .content {
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* Portfolio badge */
  .label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    font-family: 'Geist', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: #F1EDE4;
    background: rgba(241,237,228,0.06);
    border: 1px solid rgba(241,237,228,0.14);
    border-radius: 999px;
    padding: 10px 22px;
    margin-bottom: 36px;
  }

  .label::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4A9EFF;
    display: inline-block;
    box-shadow: 0 0 6px #4A9EFF;
  }

  h1 {
    font-family: 'Geist', sans-serif;
    font-size: 86px;
    font-weight: 700;
    color: #F1EDE4;
    line-height: 1;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }

  .role {
    font-family: 'Geist', sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: rgba(241,237,228,0.45);
    letter-spacing: -0.01em;
    margin-bottom: 28px;
  }

  /* thin accent line */
  .divider {
    width: 48px;
    height: 1px;
    background: rgba(74,158,255,0.5);
    margin-bottom: 28px;
  }

  .tagline {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 21px;
    color: rgba(241, 237, 228, 0.45);
    line-height: 1.5;
    max-width: 520px;
  }
</style>
</head>
<body>
  <div class="content">
    <span class="label">Portfolio</span>
    <h1>Georges Birangou</h1>
    <p class="role">Data & AI Engineer</p>
    <div class="divider"></div>
    <p class="tagline">Bridging data and AI, where solid pipelines meet intelligence.</p>
  </div>
</body>
</html>
