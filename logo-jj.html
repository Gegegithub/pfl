<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 160px;
    height: 160px;
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo {
    width: 120px;
    height: 120px;
    border: 1px solid rgba(241,237,228,0.12);
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #161616;
  }

  .letters {
    display: flex;
    align-items: baseline;
    gap: 1px;
    line-height: 1;
  }

  .j-jobby {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 60px;
    color: #CCFF00;
    letter-spacing: 0;
  }

  .j-joe {
    font-family: 'Anton', sans-serif;
    font-size: 50px;
    color: #F1EDE4;
    letter-spacing: 0;
  }

</style>
</head>
<body>
  <div class="logo">
    <div class="letters">
      <span class="j-jobby">J</span>
      <span class="j-joe">J</span>
    </div>
  </div>
</body>
</html>
